# Production compose for a single box (see docs/DEPLOYMENT.md).
#
# Reads from a .env file next to this one:
#   HAKAISHIELD_DOMAIN=customer.example
#   HAKAISHIELD_ORIGIN=https://origin.example
#   HAKAISHIELD_ORIGIN_HOST_FROM_TARGET=false
#   HAKAISHIELD_MODE=shadow
#   EVIDENCE_TOKEN=<openssl rand -hex 32>
#   HAKAISHIELD_CHALLENGE_SECRET=<openssl rand -hex 32>
#   DATABASE_URL=postgres://...
#   SUPABASE_URL=https://xxxx.supabase.co

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No published ports at all. Redis has no password by default, and an
    # internet-reachable Redis is found and taken over within hours. Only
    # the hakaishield container needs it, and it reaches it over the
    # compose network by name.
    # Challenge nonce keys must survive until their TTL. Eviction could reopen
    # replay across nodes, so full Redis fails writes instead of evicting them.
    command: redis-server --save "" --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  hakaishield:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # 443 on the host, 8443 in the container: the process runs as a
      # non-root user and cannot bind a privileged port itself.
      - "443:8443"
      # Port 80 is NOT published. certbot runs on the host and needs it
      # free for the HTTP-01 challenge during renewal.
    volumes:
      # setup.sh copies the current lineage here with key mode 0640 and
      # group 65532. Certbot's root-only tree is never exposed to the app.
      - /etc/hakaishield/tls:/run/hakaishield/tls:ro
    environment:
      HAKAISHIELD_CHALLENGE_SECRET: ${HAKAISHIELD_CHALLENGE_SECRET:?Set a stable random challenge secret}
      EVIDENCE_TOKEN: ${EVIDENCE_TOKEN:?Set a random evidence token}
      HAKAISHIELD_DASHBOARD_ORIGIN: ${HAKAISHIELD_DASHBOARD_ORIGIN:?Set the dashboard HTTPS origin}
    command:
      - "-addr=:8443"
      - "-target=${HAKAISHIELD_ORIGIN:?Set the protected origin URL}"
      - "-origin-host-from-target=${HAKAISHIELD_ORIGIN_HOST_FROM_TARGET:-false}"
      - "-host=${HAKAISHIELD_DOMAIN:?Set the public hostname}"
      - "-tls-cert=/run/hakaishield/tls/fullchain.pem"
      - "-tls-key=/run/hakaishield/tls/privkey.pem"
      - "-mode=${HAKAISHIELD_MODE:-shadow}"
      - "-redis-url=redis://redis:6379"
      - "-db-url=${DATABASE_URL:?Set the pilot PostgreSQL connection URL}"
      - "-supabase-url=${SUPABASE_URL:?Set the Supabase project URL for dashboard auth}"
      - "-sample-retention-days=${HAKAISHIELD_SAMPLE_RETENTION_DAYS:-30}"
      # -collect-labels is deliberately absent. While you are attacking your
      # own site, every solved challenge and honeypot trip would become a
      # training sample and the model would learn what YOUR bots look like.
      # Add it only once real traffic arrives (docs/LEARNED_SCORING.md).
    logging:
      driver: json-file
      options:
        # Without this, logs grow until the disk is full and the box stops
        # serving - a slow outage nobody is watching for.
        max-size: "20m"
        max-file: "5"

volumes:
  redis-data:
