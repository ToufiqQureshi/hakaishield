name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_API_BASE_URL: https://pilot.example/api/v1

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      - name: govulncheck
        # Reports only vulnerabilities in code paths we actually call.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: fuzz visitor-controlled parsers
        # A short run per target on every push. These parse hostile input
        # on the request path, where a panic is an outage for the customer.
        run: |
          go test -run='^$' -fuzz='^FuzzClientIP$'    -fuzztime=20s ./pkg/core/
          go test -run='^$' -fuzz='^FuzzVerifyBody$'  -fuzztime=20s ./pkg/challenge/
          go test -run='^$' -fuzz='^FuzzParseJA4$'    -fuzztime=20s ./pkg/signals/
          go test -run='^$' -fuzz='^FuzzUAMismatch$'  -fuzztime=20s ./pkg/signals/

      - name: golangci-lint
        # v6 of this action does not support golangci-lint v2 at all
        # ("golangci-lint v2 is not supported by golangci-lint-action
        # v6, you must update to golangci-lint-action v7"); v6's
        # "latest" resolves to a cached v1.x binary built with an
        # older Go than our go.mod targets (go1.25.0), which the v1
        # config loader then refuses to run against anyway.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          # Release binaries are built with an older Go than go.mod's
          # toolchain and refuse to load ("Go language version used to
          # build golangci-lint is lower than the targeted Go version").
          # goinstall builds it with the toolchain setup-go installed.
          install-mode: goinstall
          working-directory: backend
